<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5BA8D8"/>
      <stop offset="65%"  stop-color="#9BCDE8"/>
      <stop offset="100%" stop-color="#C8E8F8"/>
    </linearGradient>
    <linearGradient id="wall_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EEE8D8"/>
      <stop offset="100%" stop-color="#D8D0BC"/>
    </linearGradient>
    <linearGradient id="floor_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C8A870"/>
      <stop offset="100%" stop-color="#9A7840"/>
    </linearGradient>
    <linearGradient id="board_bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#233520"/>
      <stop offset="100%" stop-color="#2E4428"/>
    </linearGradient>
  </defs>

  <!-- ── BACK WALL ── -->
  <rect width="1280" height="720" fill="url(#wall_bg)"/>

  <!-- ── CHALKBOARD (left) ── -->
  <rect x="38" y="65" width="295" height="215" fill="url(#board_bg)" rx="4" stroke="#6A5030" stroke-width="7"/>
  <!-- Chalk writing -->
  <line x1="65"  y1="125" x2="310" y2="125" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <line x1="65"  y1="155" x2="295" y2="155" stroke="white" stroke-width="1.5" opacity="0.20"/>
  <line x1="65"  y1="185" x2="270" y2="185" stroke="white" stroke-width="1"   opacity="0.18"/>
  <line x1="65"  y1="215" x2="250" y2="215" stroke="white" stroke-width="1"   opacity="0.15"/>
  <text x="95" y="112" font-family="Georgia, serif" font-size="24" fill="white" opacity="0.50">Academy</text>
  <!-- Chalk tray -->
  <rect x="38" y="278" width="295" height="14" fill="#6A5030" rx="2"/>
  <rect x="55"  y="281" width="20" height="7" rx="3" fill="#F0EDE0"/>
  <rect x="82"  y="282" width="15" height="6" rx="3" fill="#F0EDE0" opacity="0.8"/>
  <rect x="104" y="281" width="12" height="7" rx="3" fill="#D8E0C8" opacity="0.7"/>

  <!-- ── NOTICE BOARD (center-left) ── -->
  <rect x="418" y="62" width="185" height="132" fill="#C8B882" rx="4" stroke="#8A7050" stroke-width="5"/>
  <rect x="432"  y="76"  width="72" height="52" fill="#FAFAE8" rx="2"/>
  <rect x="516"  y="76"  width="72" height="52" fill="#F8E8E8" rx="2" transform="rotate(-1.5,552,102)"/>
  <rect x="436"  y="140" width="66" height="38" fill="#E8F8E8" rx="2"/>
  <rect x="516"  y="136" width="66" height="42" fill="#E8F0FF" rx="2" transform="rotate(1,549,157)"/>
  <!-- Push pins -->
  <circle cx="432" cy="76"  r="4" fill="#D03030"/>
  <circle cx="516" cy="76"  r="4" fill="#30A030"/>
  <circle cx="436" cy="140" r="4" fill="#3030D0"/>
  <circle cx="516" cy="136" r="4" fill="#C08020"/>

  <!-- ── WINDOW 1 ── -->
  <rect x="730" y="42" width="190" height="385" fill="url(#sky_bg)" rx="6"/>
  <rect x="730" y="42" width="190" height="385" fill="none" stroke="#8A7050" stroke-width="10" rx="6"/>
  <line x1="825" y1="42"  x2="825" y2="427" stroke="#8A7050" stroke-width="6"/>
  <line x1="730" y1="225" x2="920" y2="225" stroke="#8A7050" stroke-width="6"/>
  <!-- Curtains -->
  <path d="M718,36 C727,74 722,165 723,228 C724,300 730,368 736,428 L756,428
           C750,368 748,300 749,228 C750,165 754,74 746,36Z"
        fill="#D0E4F4" opacity="0.82"/>
  <path d="M922,36 C913,74 918,165 917,228 C916,300 912,368 906,428 L886,428
           C892,368 894,300 895,228 C896,165 892,74 900,36Z"
        fill="#D0E4F4" opacity="0.82"/>
  <rect x="714" y="25" width="210" height="13" rx="6" fill="#7A6040"/>
  <!-- Light shaft from window 1 -->
  <polygon points="730,42 920,42 1020,440 630,440" fill="#FFE898" opacity="0.04"/>

  <!-- ── WINDOW 2 ── -->
  <rect x="990" y="42" width="190" height="385" fill="url(#sky_bg)" rx="6"/>
  <rect x="990" y="42" width="190" height="385" fill="none" stroke="#8A7050" stroke-width="10" rx="6"/>
  <line x1="1085" y1="42"  x2="1085" y2="427" stroke="#8A7050" stroke-width="6"/>
  <line x1="990"  y1="225" x2="1180" y2="225" stroke="#8A7050" stroke-width="6"/>
  <path d="M978,36 C987,74 982,165 983,228 C984,300 990,368 996,428 L1016,428
           C1010,368 1008,300 1009,228 C1010,165 1014,74 1006,36Z"
        fill="#D0E4F4" opacity="0.82"/>
  <path d="M1182,36 C1173,74 1178,165 1177,228 C1176,300 1172,368 1166,428 L1146,428
           C1152,368 1154,300 1155,228 C1156,165 1152,74 1160,36Z"
        fill="#D0E4F4" opacity="0.82"/>
  <rect x="974" y="25" width="210" height="13" rx="6" fill="#7A6040"/>
  <polygon points="990,42 1180,42 1280,440 890,440" fill="#FFE898" opacity="0.04"/>

  <!-- ── BASEBOARD ── -->
  <rect x="0" y="440" width="1280" height="14" fill="#B89858"/>

  <!-- ── FLOOR ── -->
  <polygon points="0,440 1280,440 1280,720 0,720" fill="url(#floor_bg)"/>
  <!-- Horizontal planks -->
  <line x1="0" y1="462" x2="1280" y2="462" stroke="#8A6030" stroke-width="2" opacity="0.32"/>
  <line x1="0" y1="490" x2="1280" y2="490" stroke="#8A6030" stroke-width="2" opacity="0.32"/>
  <line x1="0" y1="522" x2="1280" y2="522" stroke="#8A6030" stroke-width="2" opacity="0.32"/>
  <line x1="0" y1="560" x2="1280" y2="560" stroke="#8A6030" stroke-width="2" opacity="0.32"/>
  <line x1="0" y1="605" x2="1280" y2="605" stroke="#8A6030" stroke-width="2" opacity="0.32"/>
  <line x1="0" y1="660" x2="1280" y2="660" stroke="#8A6030" stroke-width="2" opacity="0.32"/>
  <!-- Vertical plank joints (perspective) -->
  <line x1="180"  y1="440" x2="112"  y2="720" stroke="#8A6030" stroke-width="1" opacity="0.18"/>
  <line x1="380"  y1="440" x2="295"  y2="720" stroke="#8A6030" stroke-width="1" opacity="0.18"/>
  <line x1="580"  y1="440" x2="478"  y2="720" stroke="#8A6030" stroke-width="1" opacity="0.18"/>
  <line x1="780"  y1="440" x2="660"  y2="720" stroke="#8A6030" stroke-width="1" opacity="0.18"/>
  <line x1="980"  y1="440" x2="843"  y2="720" stroke="#8A6030" stroke-width="1" opacity="0.18"/>
  <line x1="1180" y1="440" x2="1025" y2="720" stroke="#8A6030" stroke-width="1" opacity="0.18"/>

  <!-- ── FOREGROUND DESKS (two in front row) ── -->
  <!-- Desk left -->
  <polygon points="70,595  290,572  290,616  70,638"  fill="#B8904A"/>
  <polygon points="70,595  95,548   315,526  290,572" fill="#D4A860"/>
  <polygon points="290,572 315,526  315,618  290,662" fill="#9A7035"/>
  <line x1="108" y1="638" x2="102" y2="720" stroke="#7A5520" stroke-width="9"/>
  <line x1="266" y1="622" x2="260" y2="700" stroke="#7A5520" stroke-width="9"/>
  <!-- Desk right -->
  <polygon points="450,578 670,555  670,600  450,622"  fill="#B8904A"/>
  <polygon points="450,578 475,530  695,508  670,555"  fill="#D4A860"/>
  <polygon points="670,555 695,508  695,600  670,645"  fill="#9A7035"/>
  <line x1="488" y1="622" x2="482" y2="702" stroke="#7A5520" stroke-width="9"/>
  <line x1="646" y1="608" x2="640" y2="688" stroke="#7A5520" stroke-width="9"/>

  <!-- ── AMBIENT OVERLAY ── -->
  <!-- Ceiling shadow -->
  <rect x="0" y="0" width="1280" height="38" fill="#1A1408" opacity="0.14"/>
  <!-- Floor/wall junction -->
  <rect x="0" y="434" width="1280" height="8" fill="#5A4020" opacity="0.22"/>
</svg>
