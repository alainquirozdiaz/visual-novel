  <ellipse cx="156" cy="110" rx="6"   ry="5"   fill="white" opacity="0.92"/>
  <ellipse cx="168" cy="124" rx="3"   ry="2.5" fill="white" opacity="0.65"/>
  <ellipse cx="232" cy="110" rx="6"   ry="5"   fill="white" opacity="0.92"/>
  <ellipse cx="244" cy="124" rx="3"   ry="2.5" fill="white" opacity="0.65"/>
