  <path d="M138,370 L112,610 L200,620 L288,610 L262,370Z" fill="#16207A"/>
  <line x1="160" y1="372" x2="145" y2="612" stroke="#0A1050" stroke-width="1.5" opacity="0.5"/>
  <line x1="182" y1="374" x2="172" y2="618" stroke="#0A1050" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="374" x2="200" y2="620" stroke="#0A1050" stroke-width="1.5" opacity="0.5"/>
  <line x1="218" y1="374" x2="228" y2="618" stroke="#0A1050" stroke-width="1.5" opacity="0.5"/>
  <line x1="240" y1="372" x2="255" y2="612" stroke="#0A1050" stroke-width="1.5" opacity="0.5"/>

