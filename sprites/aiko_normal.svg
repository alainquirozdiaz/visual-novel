  <path d="M162,28 C176,22 196,19 216,23" stroke="#5A2A14" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M148,48 C160,41 174,38 186,40" stroke="#5A2A14" stroke-width="2.5" fill="none" opacity="0.28" stroke-linecap="round"/>
</svg>
