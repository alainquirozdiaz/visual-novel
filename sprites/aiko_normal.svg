  <ellipse cx="200" cy="112" rx="80" ry="88" fill="url(#skin_a)" stroke="#DAAA78" stroke-width="1.5"/>
  <ellipse cx="122" cy="120" rx="12" ry="16" fill="#FFD4A4" stroke="#DAAA78" stroke-width="1"/>
  <ellipse cx="278" cy="120" rx="12" ry="16" fill="#FFD4A4" stroke="#DAAA78" stroke-width="1"/>

