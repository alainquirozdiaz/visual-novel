  <ellipse cx="162" cy="116" rx="24" ry="20" fill="#FCFCFF" stroke="#181828" stroke-width="1.5"/>
  <ellipse cx="238" cy="116" rx="24" ry="20" fill="#FCFCFF" stroke="#181828" stroke-width="1.5"/>
  <!-- Iris -->
  <ellipse cx="162" cy="117" rx="16" ry="17" fill="url(#iris_aiko)"/>
  <ellipse cx="238" cy="117" rx="16" ry="17" fill="url(#iris_aiko)"/>
