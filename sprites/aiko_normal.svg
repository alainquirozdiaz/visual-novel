<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <radialGradient id="iris_aiko" cx="38%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#B8E0FF"/>
      <stop offset="50%"  stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#1A4A90"/>
    </radialGradient>
    <linearGradient id="hair_aiko" x1="0.5" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#120A06"/>
      <stop offset="100%" stop-color="#3C1C0E"/>
    </linearGradient>
    <linearGradient id="blazer_a" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#1E2888"/>
      <stop offset="100%" stop-color="#0A1050"/>
    </linearGradient>
    <linearGradient id="skin_a" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#FFE0C0"/>
      <stop offset="100%" stop-color="#EEC090"/>
